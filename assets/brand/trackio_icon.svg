<?xml version="1.0" encoding="UTF-8"?>
<!--
  Trackio app icon — vector source of truth (full-bleed opaque variant).
  Navy radial field + glow behind the brand mark in trackio_mark.svg.
  Platform PNGs are rendered from the equivalent ImageMagick pipeline.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" gradientUnits="userSpaceOnUse" cx="512" cy="420" r="760">
      <stop offset="0" stop-color="#0B2C82"/>
      <stop offset="1" stop-color="#001233"/>
    </radialGradient>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="512" cy="470" r="300">
      <stop offset="0" stop-color="#0F85FA" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#0F85FA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bagGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5FAFF"/>
      <stop offset="1" stop-color="#A9C8FB"/>
    </linearGradient>
    <radialGradient id="wedgeGrad" gradientUnits="userSpaceOnUse" cx="512" cy="468" r="388">
      <stop offset="0" stop-color="#3CA0FF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#3CA0FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <g fill="none">
    <circle cx="512" cy="468" r="388" stroke="#5AAAFF" stroke-opacity="0.34" stroke-width="5"/>
    <circle cx="512" cy="468" r="280" stroke="#5AAAFF" stroke-opacity="0.60" stroke-width="6"/>
    <circle cx="512" cy="468" r="170" stroke="#5AAAFF" stroke-opacity="0.95" stroke-width="7"/>
  </g>
  <g stroke="#96C8FF" stroke-opacity="0.22" stroke-width="4">
    <line x1="512" y1="60" x2="512" y2="876"/>
    <line x1="100" y1="468" x2="924" y2="468"/>
  </g>
  <path d="M 512 468 L 512 80 A 388 388 0 0 1 887 568 Z" fill="url(#wedgeGrad)" filter="url(#soft)"/>

  <path d="M 418 516 C 418 404 606 404 606 516" fill="none"
        stroke="#DCEAFF" stroke-width="44" stroke-linecap="round"/>
  <rect x="336" y="500" width="352" height="288" rx="80" fill="url(#bagGrad)"/>
  <g fill="none">
    <circle cx="512" cy="646" r="66" stroke="#0F85FA" stroke-opacity="0.45" stroke-width="7"/>
    <circle cx="512" cy="646" r="42" stroke="#0F85FA" stroke-width="10"/>
  </g>
  <circle cx="512" cy="646" r="20" fill="#0F85FA"/>
  <circle cx="512" cy="646" r="8" fill="#FFFFFF"/>
</svg>
