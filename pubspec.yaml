name: trackio
description: "Trackio — smart bag tracking with a live ESP32 BLE link (Android, iOS, web)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  google_fonts: ^6.2.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  fl_chart: ^1.2.0
  audioplayers: ^6.8.1
  shared_preferences: ^2.5.6
  intl: ^0.20.2
  # Real ESP32 bag-module link (GATT central: scan, secure pair, telemetry).
  flutter_blue_plus: ^1.32.0
  # Runtime BLE/location permission requests (Android 12+ BLE perms, pre-31 location).
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/google_fonts/
